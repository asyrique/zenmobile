name: CI

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:
    inputs:
      ios:
        description: "Also build the iOS app (macOS runner, billed at a higher rate)"
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SWIFT_VERSION: "6.3.3"

jobs:
  # Rust tests, then the generated Swift bindings compiled and tested against
  # the real library. The bindings are platform-independent, so the other
  # jobs reuse them from here.
  core:
    name: Core (Rust + Swift, Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install NSS
        run: sudo apt-get update -q && sudo apt-get install -y -q libnss3
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Install Swift
        run: scripts/ci/install-swift-linux.sh
      - name: Rust tests
        run: |
          . scripts/env-linux.sh
          cd core
          cargo test --workspace
      - name: Swift tests
        env:
          ZEN_NETWORK_TESTS: "1"
        run: scripts/test-swift-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: zencore-bindings
          path: |
            core/swift/ZenCore/Sources/ZenCore/Generated
            core/swift/ZenCore/Sources/ZenCoreFFI/include
          if-no-files-found: error

  # NSS and the Rust core for Android, the app's Swift (SwiftUI-on-Android
  # via Skip Fuse) cross-compiled for arm64, then the APK: Skip transpiles
  # the Kotlin side and Gradle pulls in GeckoView. All on Linux; Skip's
  # Gradle build only needs a stand-in for Apple's xcrun.
  android:
    name: Android (Linux)
    runs-on: ubuntu-24.04
    needs: core
    steps:
      - uses: actions/checkout@v4
      - name: Select NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: android
      - name: Cache NSS
        id: nss-cache
        uses: actions/cache@v4
        with:
          path: .build-deps/application-services/libs/android
          key: nss-android-${{ hashFiles('core/Cargo.toml', 'scripts/build-nss.sh') }}
      - name: Build NSS
        if: steps.nss-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/gyp" && "$RUNNER_TEMP/gyp/bin/pip" install -q gyp-next
          export PATH="$RUNNER_TEMP/gyp/bin:$PATH"
          sudo apt-get install -y -q ninja-build
          scripts/build-nss.sh android
      - name: Build libzen_core.so
        run: scripts/build-core-android.sh arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: zencore-android
          path: core/swift/ZenCore/lib/android
          if-no-files-found: error
      - uses: actions/download-artifact@v4
        with:
          name: zencore-bindings
          path: core/swift/ZenCore/Sources
      - name: Install Swift + Android SDK
        run: scripts/ci/install-swift-linux.sh --android
      - name: Install Skip
        run: scripts/ci/install-skip-linux.sh
      - name: Build app Swift for Android (arm64)
        working-directory: app
        run: |
          skip android build --plain --arch aarch64 \
            --toolchain "$(dirname "$(dirname "$(dirname "$(which swift)")")")" \
            --swift "$(which swift)" \
            --sdk "$SWIFT_ANDROID_SDK_BUNDLE" \
            --ndk "$ANDROID_NDK_HOME"
      - name: Install Android platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.2" "build-tools;37.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Build APK
        working-directory: app
        run: |
          export PATH="$GITHUB_WORKSPACE/scripts/ci/xcrun-shim:$PATH"
          if ! skip export --debug --no-ios --arch aarch64 --no-export-project -d ../build/skip-export --plain; then
            # Skip keeps the details in its own log; surface the failure.
            mkdir -p ../build/logs
            for log in /tmp/skip-export-*.txt; do
              grep -nE "^e: |error:" "$log" | head -40
              grep -A60 "What went wrong" "$log"
              # Artifact names can't contain the colons in Skip's timestamp.
              cp "$log" "../build/logs/$(basename "$log" | tr ':' '-')"
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: skip-export-logs
          path: build/logs
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/skip-export/*.apk
          if-no-files-found: error

  # The iOS app for the simulator. macOS minutes cost several times Linux
  # ones, so this runs only for main, pull requests and manual runs, and
  # does nothing Android (the APK is built on Linux above).
  ios:
    name: iOS app (macOS)
    runs-on: macos-26
    needs: core
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.ios)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: ios
      - name: Cache NSS
        id: nss-cache
        uses: actions/cache@v4
        with:
          path: .build-deps/application-services/libs/ios
          key: nss-ios-${{ hashFiles('core/Cargo.toml', 'scripts/build-nss.sh') }}
      - name: Build NSS
        if: steps.nss-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/gyp" && "$RUNNER_TEMP/gyp/bin/pip" install -q gyp-next
          export PATH="$RUNNER_TEMP/gyp/bin:$PATH"
          brew install ninja
          scripts/build-nss.sh ios
      - name: Build ZenCoreRust.xcframework
        run: scripts/build-core-ios.sh
      - uses: actions/download-artifact@v4
        with:
          name: zencore-bindings
          path: core/swift/ZenCore/Sources
      - uses: skiptools/actions/setup-skip@v1
        with:
          run-doctor: "false"
      - name: Build iOS app (simulator)
        working-directory: app
        run: |
          xcodebuild build \
            -project Darwin/ZenMobile.xcodeproj \
            -scheme "ZenMobile App" \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath ../build/DerivedData \
            -skipPackagePluginValidation -skipMacroValidation \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO SKIP_ACTION=none
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: build/DerivedData/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: warn
