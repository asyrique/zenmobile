[workspace]
resolver = "2"
members = ["zen-spaces", "zen-core", "uniffi-bindgen"]

[workspace.package]
edition = "2021"
license = "MPL-2.0"
version = "0.1.0"

# Mozilla application-services, pinned. Bump all of these together; the
# uniffi patch below must match the rev application-services itself uses
# (see its top-level Cargo.toml).
[workspace.dependencies]
fxa-client = { git = "https://github.com/mozilla/application-services", rev = "723ccb82acf461404d8243a3ad231d7c6fa9d2f3" }
tabs = { git = "https://github.com/mozilla/application-services", rev = "723ccb82acf461404d8243a3ad231d7c6fa9d2f3" }
sync15 = { git = "https://github.com/mozilla/application-services", rev = "723ccb82acf461404d8243a3ad231d7c6fa9d2f3" }
sync-guid = { git = "https://github.com/mozilla/application-services", rev = "723ccb82acf461404d8243a3ad231d7c6fa9d2f3", features = ["random"] }
interrupt-support = { git = "https://github.com/mozilla/application-services", rev = "723ccb82acf461404d8243a3ad231d7c6fa9d2f3" }
error-support = { git = "https://github.com/mozilla/application-services", rev = "723ccb82acf461404d8243a3ad231d7c6fa9d2f3" }
init_rust_components = { git = "https://github.com/mozilla/application-services", rev = "723ccb82acf461404d8243a3ad231d7c6fa9d2f3" }
viaduct = { git = "https://github.com/mozilla/application-services", rev = "723ccb82acf461404d8243a3ad231d7c6fa9d2f3" }
viaduct-backend-rust = { git = "https://github.com/mozilla/application-services", rev = "723ccb82acf461404d8243a3ad231d7c6fa9d2f3" }
rust-log-forwarder = { git = "https://github.com/mozilla/application-services", rev = "723ccb82acf461404d8243a3ad231d7c6fa9d2f3" }
embedded-uniffi-bindgen = { git = "https://github.com/mozilla/application-services", rev = "723ccb82acf461404d8243a3ad231d7c6fa9d2f3" }

anyhow = "1.0"
parking_lot = "0.12"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uniffi = { version = "0.32" }
url = "2"

[patch.crates-io]
uniffi = { git = "https://github.com/mozilla/uniffi-rs.git", rev = "81c5d86ccb453ff4a51e91f03d51aa91a8cc549b" }
uniffi_bindgen = { git = "https://github.com/mozilla/uniffi-rs.git", rev = "81c5d86ccb453ff4a51e91f03d51aa91a8cc549b" }
uniffi_pipeline = { git = "https://github.com/mozilla/uniffi-rs.git", rev = "81c5d86ccb453ff4a51e91f03d51aa91a8cc549b" }
mozbuild = { git = "https://github.com/mozilla/application-services", rev = "723ccb82acf461404d8243a3ad231d7c6fa9d2f3" }

[profile.release]
opt-level = "s"
lto = "thin"
