<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The end-to-end tests load this page and check the title and heading.
       CI serves it with: python3 -m http.server 8765 -d scripts/ci/e2e-site -->
  <title>Zen E2E</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center;
           background: linear-gradient(135deg, #7b4fd8, #2a1858); color: white; text-align: center; }
    h1 { font-size: 2.5rem; margin: 0 0 .5rem; }
  </style>
</head>
<body>
  <main>
    <h1>Hello from Zen</h1>
    <p>If you can read this, the browser loaded the end-to-end test page.</p>
    <!-- The tests tap this, accept the dialog, and check the answer appears. -->
    <p><button style="font-size: 1.5rem" onclick="document.getElementById('answer').textContent = confirm('Continue with the test?') ? 'Confirmed' : 'Cancelled'">Ask to confirm</button></p>
    <p id="answer"></p>
    <!-- The tests tap this to check a new window opens as a new tab. -->
    <p><a href="second.html" target="_blank" style="color: white; font-size: 1.5rem">Open in a new tab</a></p>
  </main>
</body>
</html>
