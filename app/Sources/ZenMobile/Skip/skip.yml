# Skip configuration for the ZenMobile module.

# this is a natively-compiled Skip Fuse module
skip:
  mode: 'native'

# GeckoView is published on Mozilla's Maven, which every module (and the
# app) has to be able to resolve, so it goes in the project-wide settings.
settings:
  contents:
    - block: 'dependencyResolutionManagement'
      contents:
        - block: 'repositories'
          contents:
            - 'maven("https://maven.mozilla.org/maven2/")'

build:
  contents:
    # GeckoView 159 (and the AndroidX it pulls in) must be compiled against
    # Android 37.2; Skip's catalog default is lower. Appended after Skip's own
    # android block, so it wins. The app module sets the same.
    - block: 'android'
      contents:
        - block: 'compileSdk'
          contents:
            - 'version = release(37) { minorApiLevel = 2 }'
    - block: 'dependencies'
      contents:
        # Keep in step with the Firefox version Zen desktop is built on
        # (surfer.json in zen-browser/desktop).
        - 'implementation("org.mozilla.geckoview:geckoview:159.0.20261022150525")'
